    /* Hero Banner */
    .hero {
      background: url('donuts.png') center/cover no-repeat;
      color: white;
      padding: 100px 0;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
    }
    .hero .container {
      position: relative;
      z-index: 2;
    }

    /* Image Styling */
    .gallery-img {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .gallery-img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>

<button id="backToTop" class="btn btn-danger rounded-circle">
  ↑
</button>

<script>
  const btn = document.getElementById("backToTop");
  window.onscroll = function() {
    if (document.documentElement.scrollTop > 300) {
      btn.style.display = "block";
    } else {
      btn.style.display = "none";
    }
  };
  btn.onclick = function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
</script>

<style>
  #backToTop {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: none;
    z-index: 999;
    width: 45px;

    font-size: 20px;
