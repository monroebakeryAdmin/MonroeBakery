    /* Navbar styling (matches all other pages) */
    .navbar {
      background-color: #b21f1f !important;
      z-index: 1050;
    }
    .navbar-brand {
      font-weight: bold;
      color: #fff !important;
    }

    .navbar-toggler {
      border: none;
      z-index: 1100;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 6px 10px;
      transition: background 0.3s ease;
    }
    .navbar-toggler:hover {
      background: rgba(255,255,255,0.25);
    }
    .navbar-toggler:focus {
      box-shadow: none;
      outline: none;
    }

    /* ✅ White hamburger icon inside rounded translucent box */
    .navbar-toggler-icon {
      width: 1.4em;
      height: 1.4em;
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba(255,255,255,1)' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
      background-size: 100% 100%;
    }

    .navbar-nav .nav-link {
      color: #fff !important;
    }
    .navbar-nav .nav-link.active {
      font-weight: bold;
      text-decoration: underline;
    }

    /* Hero Banner */
    .hero {
      background: url('images/easterorthodoxcross.png') center/cover no-repeat;
      color: white;
      padding: 100px 0;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
    }
    .hero .container {
      position: relative;
      z-index: 2;
    }

    /* Image Styling */
    .gallery-img {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .gallery-img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* Back to Top Button */
    #backToTop {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: none;
      z-index: 999;
      width: 45px;
      height: 45px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 30px;
    }
  </style>
</head>

<!-- Back to Top Button -->
<button id="backToTop" class="btn btn-danger rounded-circle">↑</button>

<script>
  const btn = document.getElementById("backToTop");
  window.onscroll = function() {
    if (document.documentElement.scrollTop > 300) {
      btn.style.display = "block";
    } else {
      btn.style.display = "none";
    }
  };
  btn.onclick = function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
</script>
